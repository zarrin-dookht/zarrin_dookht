<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت سفارش | زرین دوخت</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
            transition: 0.3s;
        }

        body.dark {
            background: #181818;
            color: white;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a,
        .dark-button {
            color: white;
            text-decoration: none;
            background: #333;
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        body.dark .box {
            background: #242424;
            color: white;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            font-family: inherit;
        }

        body.dark input,
        body.dark textarea {
            background: #333;
            color: white;
            border-color: #555;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        body.dark .order-item {
            border-color: #555;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }

        .submit-button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #333;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }

        body.dark .back {
            color: #ddd;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
            }

            .container {
                padding: 12px;
            }

            .box {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        👕 زرین دوخت
    </div>

    <nav>
        <a href="index.html">
            🏠 خانه
        </a><a href="cart.html">
            🛒 سبد خرید
        </a>

        <button
            class="dark-button"
            id="darkButton"
            onclick="toggleDarkMode()"
        >
            🌙 حالت تیره
        </button>
    </nav>
</header>


<div class="container">

    <h1>
        🛍️ ثبت سفارش
    </h1>


    <div class="box">

        <h2>
            📦 محصولات سفارش
        </h2>

        <div id="orderItems"></div>

        <div class="total">
            مجموع:
            <span id="totalPrice">
                ۰
            </span>
            تومان
        </div>

    </div>


    <div class="box">

        <h2>
            👤 اطلاعات مشتری
        </h2>

        <form id="orderForm">

            <label>
                نام و نام خانوادگی
            </label>

            <input
                type="text"
                id="name"
                placeholder="مثلاً علی رضایی"
                required
            >


            <label>
                شماره تماس
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="مثلاً 09123456789"
                required
            >


            <label>
                آدرس
            </label>

            <textarea
                id="address"
                placeholder="آدرس کامل خود را وارد کنید"
                required
            ></textarea>


            <label>
                پلاک
            </label>

            <input
                type="text"
                id="plaque"
                placeholder="مثلاً ۲۵"
                required
            >


            <label>
                کد پستی
            </label>

            <input
                type="text"
                id="postalCode"
                placeholder="کد پستی ۱۰ رقمی"
                inputmode="numeric"
                maxlength="10"
                pattern="[0-9۰-۹]{10}"
                required
            >


            <label>
                توضیحات سفارش
            </label>

            <textarea
                id="description"
                placeholder="توضیحات اضافی سفارش"
            ></textarea>


            <button
                type="submit"
                class="submit-button"
            >
                💳 ادامه به پرداخت
            </button>

        </form>


        <a
            href="cart.html"
            class="back"
        >
            ← برگشت به سبد خرید
        </a>

    </div>

</div>


<footer>
    فروشگاه لباس زرین دوخت
    <br><br>
    تمامی حقوق محفوظ است © ۲۰۲۶
</footer>


<script>

function getCart() {

    try {

        const saved =
            localStorage.getItem("cart");

        if (!saved) {
            return [];
        }

        const data =
            JSON.parse(saved);

        return Array.isArray(data)
            ? data
            : [];

    } catch (error) {

        return [];

    }

}


function calculateTotal(cart) {

    let total = 0;

    cart.forEach(function(item) {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;

        total += price * quantity;

    });

    return total;

}


function showOrder() {

    const cart =
        getCart();

    const container =
        document.getElementById("orderItems");

    const totalPrice =
        document.getElementById("totalPrice");

    container.innerHTML = "";

    if (cart.length === 0) {

        container.innerHTML =
            "<p>سبد خرید شما خالی است.</p>";

        totalPrice.textContent = "۰";

        return;

    }


    const total =
        calculateTotal(cart);


    cart.forEach(function(item) {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;


        const div =
            document.createElement("div");

        div.className =
            "order-item";


        const name =
            document.createElement("span");

        name.textContent =
            item.name + " × " + quantity;const priceText =
            document.createElement("span");

        priceText.textContent =
            (price * quantity)
            .toLocaleString("fa-IR")
            + " تومان";


        div.appendChild(name);

        div.appendChild(priceText);

        container.appendChild(div);

    });


    totalPrice.textContent =
        total.toLocaleString("fa-IR");

}


document
    .getElementById("orderForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const name =
            document
            .getElementById("name")
            .value
            .trim();


        const phone =
            document
            .getElementById("phone")
            .value
            .trim();


        const address =
            document
            .getElementById("address")
            .value
            .trim();


        const plaque =
            document
            .getElementById("plaque")
            .value
            .trim();


        const postalCode =
            document
            .getElementById("postalCode")
            .value
            .trim();


        const description =
            document
            .getElementById("description")
            .value
            .trim();


        const cart =
            getCart();


        if (cart.length === 0) {

            alert(
                "سبد خرید شما خالی است."
            );

            return;

        }


        if (postalCode.length !== 10) {

            alert(
                "کد پستی باید ۱۰ رقم باشد."
            );

            return;

        }


        const total =
            calculateTotal(cart);


        const order = {

            id:
                Date.now(),

            name:
                name,

            phone:
                phone,

            address:
                address,

            plaque:
                plaque,

            postalCode:
                postalCode,

            description:
                description,

            products:
                cart,

            total:
                total,

            date:
                new Date()
                .toLocaleString("fa-IR")

        };


        localStorage.setItem(
            "lastOrder",
            JSON.stringify(order)
        );


        /*
         * فعلاً سبد خرید را پاک نمی‌کنیم.
         * بعد از پرداخت موفق آن را پاک می‌کنیم.
         */


        window.location.href =
            "payment.html";

    });


/* حالت تیره */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    const isDark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "darkMode",
        isDark ? "on" : "off"
    );


    updateDarkButton();

}


function loadDarkMode() {

    const mode =
        localStorage.getItem(
            "darkMode"
        );


    if (mode === "on") {

        document.body.classList.add(
            "dark"
        );

    }


    updateDarkButton();

}


function updateDarkButton() {

    const button =
        document.getElementById(
            "darkButton"
        );


    if (!button) {
        return;
    }


    if (
        document.body.classList.contains(
            "dark"
        )
    ) {

        button.textContent =
            "☀️ حالت روشن";

    } else {

        button.textContent =
            "🌙 حالت تیره";

    }

}


showOrder();

loadDarkMode();

</script>

</body>
</html>
