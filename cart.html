<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سبد خرید | زرین دوخت</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
    transition: 0.3s;
}

body.dark {
    background: #181818;
    color: white;
}

header {
    background: #111;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav a,
.dark-button {
    color: white;
    text-decoration: none;
    background: #333;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

h1 {
    text-align: center;
    margin: 45px 0 30px;
}

.cart {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.cart-item {
    background: white;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    transition: 0.3s;
}

body.dark .cart-item {
    background: #242424;
    color: white;
}

.cart-item img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
}

.item-info {
    flex: 1;
}

.item-info h2 {
    margin-top: 0;
}

.price {
    font-weight: bold;
    font-size: 18px;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
}

.quantity button {
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 20px;
}

.remove {
    background: #eee;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

body.dark .remove {
    background: #444;
    color: white;
}

.total {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-top: 25px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

body.dark .total {
    background: #242424;
    color: white;
}

.checkout-button {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    background: #111;
    color: white;
    border: none;
    border-radius: 10px;
    text-decoration: none;
    text-align: center;
    font-size: 18px;
    cursor: pointer;
}

.checkout-button:hover {
    background: #333;
}

.empty {
    text-align: center;
    padding: 70px 20px;
    color: #777;
    font-size: 20px;
}

body.dark .empty {
    color: #bbb;
}

.shop-button {
    display: inline-block;
    margin-top: 20px;
    background: #111;
    color: white;
    padding: 13px 25px;
    border-radius: 8px;
    text-decoration: none;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 30px;
    margin-top: 60px;
}

@media (max-width: 650px) {

    header {
        flex-direction: column;
    }

    .cart-item {
        flex-direction: column;
        text-align: center;
    }

    .cart-item img {
        width: 180px;
        height: 180px;
    }

    .quantity {
        justify-content: center;
    }

}

</style>
</head>


<body>


<header>

<div class="logo">
    👕 زرین دوخت
</div>


<nav>

<a href="index.html">
    🏠 خانه
</a>

<a href="favorites.html">
    ❤️ علاقه‌مندی‌ها
</a>

<a href="cart.html">
    🛒 سبد خرید
</a>

<button
    class="dark-button"
    id="darkButton"
    onclick="toggleDarkMode()"
>
    🌙 حالت تیره
</button>

</nav>

</header>


<h1>
    🛒 سبد خرید
</h1>


<main class="cart">


<div id="cartItems"></div>


<div
    id="empty"
    class="empty"
    style="display:none;"
>

    🛒 سبد خرید شما خالی است.

    <br>

    <a
        class="shop-button"
        href="index.html"
    >
        برگشت به فروشگاه
    </a>

</div>


<div
    id="totalBox"
    class="total"
    style="display:none;"
>

    مجموع:

    <span id="totalPrice">
        ۰
    </span>

    تومان<a
        href="checkout.html"
        class="checkout-button"
    >
        🛍️ ادامه و ثبت سفارش
    </a>

</div>


</main>


<footer>

فروشگاه لباس زرین دوخت

<br><br>

تمامی حقوق محفوظ است © ۲۰۲۶

</footer>


<script>


function getCart() {

    try {

        const saved =
            localStorage.getItem("cart");

        if (!saved) {
            return [];
        }

        const data =
            JSON.parse(saved);

        return Array.isArray(data)
            ? data
            : [];

    } catch (error) {

        return [];

    }

}


function saveCart(cart) {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


function showCart() {

    const cart =
        getCart();

    const container =
        document.getElementById("cartItems");

    const empty =
        document.getElementById("empty");

    const totalBox =
        document.getElementById("totalBox");

    const totalPrice =
        document.getElementById("totalPrice");


    container.innerHTML = "";


    if (cart.length === 0) {

        empty.style.display = "block";

        totalBox.style.display = "none";

        return;

    }


    empty.style.display = "none";

    totalBox.style.display = "block";


    let total = 0;


    cart.forEach(function(item, index) {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;


        total =
            total + (price * quantity);


        const card =
            document.createElement("div");

        card.className =
            "cart-item";


        const image =
            document.createElement("img");

        image.src =
            item.image;

        image.alt =
            item.name;


        const info =
            document.createElement("div");

        info.className =
            "item-info";


        const title =
            document.createElement("h2");

        title.textContent =
            item.name;


        const priceElement =
            document.createElement("div");

        priceElement.className =
            "price";

        priceElement.textContent =
            price.toLocaleString("fa-IR")
            + " تومان";


        const quantityBox =
            document.createElement("div");

        quantityBox.className =
            "quantity";


        const plusButton =
            document.createElement("button");

        plusButton.textContent =
            "+";

        plusButton.onclick =
            function() {

                changeQuantity(index, 1);

            };


        const quantityText =
            document.createElement("span");

        quantityText.textContent =
            "تعداد: " + quantity;


        const minusButton =
            document.createElement("button");

        minusButton.textContent =
            "−";

        minusButton.onclick =
            function() {

                changeQuantity(index, -1);

            };


        quantityBox.appendChild(
            plusButton
        );

        quantityBox.appendChild(
            quantityText
        );

        quantityBox.appendChild(
            minusButton
        );


        const br =
            document.createElement("br");


        const removeButton =
            document.createElement("button");

        removeButton.className =
            "remove";

        removeButton.textContent =
            "حذف محصول";

        removeButton.onclick =
            function() {

                removeItem(index);

            };


        info.appendChild(title);

        info.appendChild(priceElement);

        info.appendChild(quantityBox);

        info.appendChild(br);

        info.appendChild(removeButton);


        card.appendChild(image);

        card.appendChild(info);


        container.appendChild(card);

    });


    totalPrice.textContent =
        total.toLocaleString("fa-IR");

}


function changeQuantity(index, change) {

    const cart =
        getCart();


    if (!cart[index]) {
        return;
    }cart[index].quantity =
        (Number(cart[index].quantity) || 1)
        + change;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    saveCart(cart);

    showCart();

}


function removeItem(index) {

    const cart =
        getCart();


    cart.splice(index, 1);


    saveCart(cart);

    showCart();

}


/* حالت تیره */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    const isDark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "darkMode",
        isDark ? "on" : "off"
    );


    updateDarkButton();

}


function loadDarkMode() {

    const mode =
        localStorage.getItem(
            "darkMode"
        );


    if (mode === "on") {

        document.body.classList.add(
            "dark"
        );

    }


    updateDarkButton();

}


function updateDarkButton() {

    const button =
        document.getElementById(
            "darkButton"
        );


    if (!button) {
        return;
    }


    if (
        document.body.classList.contains(
            "dark"
        )
    ) {

        button.textContent =
            "☀️ حالت روشن";

    } else {

        button.textContent =
            "🌙 حالت تیره";

    }

}


showCart();

loadDarkMode();


</script>

</body>
</html>
