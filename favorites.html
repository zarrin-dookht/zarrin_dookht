<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>علاقه‌مندی‌ها | زرین دوخت</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
    transition: 0.3s;
}

body.dark {
    background: #181818;
    color: white;
}

header {
    background: #111;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav a,
.dark-button {
    color: white;
    text-decoration: none;
    background: #333;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

h1 {
    text-align: center;
    margin: 45px 0 30px;
}

.favorites {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
}

.favorite-product {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

body.dark .favorite-product {
    background: #242424;
    color: white;
}

.favorite-product img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    display: block;
}

.info {
    padding: 22px;
    text-align: center;
}

.info h2 {
    margin-top: 0;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin: 15px 0;
}

.buttons {
    display: flex;
    gap: 10px;
}

.buttons a,
.buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 15px;
    text-decoration: none;
}

.view {
    background: #111;
    color: white;
}

.remove {
    background: #eee;
    color: #222;
}

.empty {
    text-align: center;
    padding: 70px 20px;
    color: #777;
    font-size: 20px;
}

body.dark .empty {
    color: #bbb;
}

.empty a {
    display: inline-block;
    margin-top: 20px;
    background: #111;
    color: white;
    padding: 13px 25px;
    border-radius: 8px;
    text-decoration: none;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 30px;
    margin-top: 60px;
}

@media (max-width: 650px) {

    header {
        flex-direction: column;
    }

    .favorites {
        grid-template-columns: 1fr;
    }

    .favorite-product img {
        height: 350px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        👕 زرین دوخت
    </div>

    <nav>

        <a href="index.html">
            🏠 خانه
        </a>

        <a href="favorites.html">
            ❤️ علاقه‌مندی‌ها
        </a>

        <a href="cart.html">
            🛒 سبد خرید
        </a>

        <button
            class="dark-button"
            onclick="toggleDarkMode()"
            id="darkButton"
        >
            🌙 حالت تیره
        </button>

    </nav>

</header>


<h1>
    ❤️ علاقه‌مندی‌های من
</h1>


<main
    id="favorites"
    class="favorites"
></main>


<div
    id="empty"
    class="empty"
    style="display: none;"
>

    ❤️ هنوز محصولی به علاقه‌مندی‌ها اضافه نکرده‌ای.

    <br><br>

    <a href="index.html">
        مشاهده محصولات
    </a>

</div>


<footer>

    فروشگاه لباس زرین دوخت

    <br><br>

    تمامی حقوق محفوظ است © ۲۰۲۶

</footer>


<script>


const products = {

    1: {
        id: 1,
        name: "تیشرت و شلوار راحتی با طرح رویای آبی",
        price: "۱,۱۹۰,۰۰۰ تومان",
        image: "royaye-abi-front.jpg.jpeg",
        link: "royaye-abi.html"
    },

    2: {
        id: 2,
        name: "تیشرت و شلوار راحتی با طرح دشت آرام",
        price: "۱,۱۹۰,۰۰۰ تومان",
        image: "dasht-aram-front.Jpg.jpeg",
        link: "dasht-aram.html"
    },

    3: {
        id: 3,
        name: "تیشرت و شلوار راحتی با طرح بهار شکوفه ها",
        price: "۱,۱۹۰,۰۰۰ تومان",
        image: "bahar-shekofe-front.jpg.jpeg",
        link: "bahar-shekofe.html"4: {
        id: 4,
        name: "تیشرت و شلوار راحتی با طرح باغ پریان",
        price: "۱,۱۹۰,۰۰۰ تومان",
        image: "bag-paryan-front.jpg.jpeg",
        link: "bag-paryan.html"
    }

};


function getFavorites() {

    try {

        const saved =
            localStorage.getItem("favorites");

        if (!saved) {
            return [];
        }

        const data =
            JSON.parse(saved);

        return Array.isArray(data)
            ? data
            : [];

    } catch (error) {

        return [];

    }

}


function showFavorites() {

    const favorites =
        getFavorites();

    const container =
        document.getElementById("favorites");

    const empty =
        document.getElementById("empty");

    container.innerHTML = "";


    if (favorites.length === 0) {

        empty.style.display = "block";

        return;

    }


    empty.style.display = "none";


    favorites.forEach(function(id) {

        const product =
            products[id];

        if (!product) {
            return;
        }


        const card =
            document.createElement("div");

        card.className =
            "favorite-product";


        const image =
            document.createElement("img");

        image.src =
            product.image;

        image.alt =
            product.name;


        const info =
            document.createElement("div");

        info.className =
            "info";


        const title =
            document.createElement("h2");

        title.textContent =
            product.name;


        const price =
            document.createElement("div");

        price.className =
            "price";

        price.textContent =
            product.price;


        const buttons =
            document.createElement("div");

        buttons.className =
            "buttons";


        const view =
            document.createElement("a");

        view.className =
            "view";

        view.href =
            product.link;

        view.textContent =
            "مشاهده محصول";


        const remove =
            document.createElement("button");

        remove.className =
            "remove";

        remove.textContent =
            "حذف ❤️";


        remove.onclick =
            function() {

                removeFavorite(product.id);

            };


        buttons.appendChild(view);

        buttons.appendChild(remove);


        info.appendChild(title);

        info.appendChild(price);

        info.appendChild(buttons);


        card.appendChild(image);

        card.appendChild(info);


        container.appendChild(card);

    });

}


function removeFavorite(id) {

    let favorites =
        getFavorites();


    favorites =
        favorites.filter(function(item) {

            return item !== id;

        });


    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );


    showFavorites();

}


function toggleDarkMode() {

    document.body.classList.toggle("dark");

    const isDark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "darkMode",
        isDark ? "on" : "off"
    );

    updateDarkButton();

}


function loadDarkMode() {

    const mode =
        localStorage.getItem("darkMode");

    if (mode === "on") {

        document.body.classList.add("dark");

    }

    updateDarkButton();

}


function updateDarkButton() {

    const button =
        document.getElementById("darkButton");

    if (!button) {
        return;
    }

    if (
        document.body.classList.contains("dark")
    ) {

        button.textContent =
            "☀️ حالت روشن";

    } else {

        button.textContent =
            "🌙 حالت تیره";

    }

}


showFavorites();

loadDarkMode();

</script>


</body>

</html>
    },
