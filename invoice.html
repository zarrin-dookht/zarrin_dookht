<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فاکتور سفارش | زرین دوخت</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
    transition: 0.3s;
}

body.dark {
    background: #181818;
    color: white;
}

header {
    background: #111;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav a,
.dark-button {
    color: white;
    text-decoration: none;
    background: #333;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

nav a:hover,
.dark-button:hover {
    background: #444;
}

.container {
    max-width: 850px;
    margin: 40px auto;
    padding: 20px;
}

.invoice {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

body.dark .invoice {
    background: #242424;
}

.invoice-title {
    text-align: center;
    margin-bottom: 30px;
}

.invoice-title h1 {
    margin-bottom: 8px;
}

.invoice-number {
    color: #777;
}

body.dark .invoice-number {
    color: #bbb;
}

.customer-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
}

.info-box {
    padding: 14px;
    background: #f5f5f5;
    border-radius: 10px;
}

body.dark .info-box {
    background: #303030;
}

.info-box strong {
    display: block;
    margin-bottom: 6px;
}

.products-title {
    margin-bottom: 10px;
}

.product {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
}

body.dark .product {
    border-color: #555;
}

.product-name {
    font-weight: bold;
}

.product-price {
    white-space: nowrap;
}

.total {
    text-align: left;
    font-size: 22px;
    font-weight: bold;
    margin-top: 25px;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 30px;
}

.action-button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #111;
    color: white;
    cursor: pointer;
    font-size: 16px;
    text-decoration: none;
    text-align: center;
}

.action-button:hover {
    background: #333;
}

.empty {
    text-align: center;
    padding: 40px 10px;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 30px;
    margin-top: 50px;
}

@media (max-width: 600px) {

    header {
        flex-direction: column;
    }

    .container {
        padding: 12px;
    }

    .invoice {
        padding: 20px;
    }

    .customer-info {
        grid-template-columns: 1fr;
    }

    .product {
        flex-direction: column;
    }

    .total {
        text-align: center;
    }

    .actions {
        flex-direction: column;
    }
}

/* هنگام چاپ */
@media print {

    header,
    footer,
    .actions {
        display: none;
    }

    body {
        background: white;
        color: black;
    }

    .container {
        max-width: 100%;
        margin: 0;
        padding: 0;
    }

    .invoice {
        box-shadow: none;
        border-radius: 0;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
    👕 زرین دوخت
</div>

<nav>

<a href="index.html">
    🏠 خانه
</a>

<a href="cart.html">
    🛒 سبد خرید
</a>

<a href="tracking.html">
    📦 پیگیری سفارش
</a>

<button
    class="dark-button"
    id="darkButton"
    onclick="toggleDarkMode()"
>
    🌙 حالت تیره
</button>

</nav>

</header>


<div class="container">

<div class="invoice" id="invoice">

<div class="invoice-title">

<h1>
    🧾 فاکتور سفارش
</h1>

<div class="invoice-number">
    شماره سفارش:
    <span id="orderId">---</span>
</div>

</div>


<div class="customer-info">

<div class="info-box">

<strong>
    👤 نام مشتری
</strong><span id="customerName">
    ---
</span>

</div>


<div class="info-box">

<strong>
    📞 شماره تماس
</strong>

<span id="customerPhone">
    ---
</span>

</div>


<div class="info-box">

<strong>
    📍 آدرس
</strong>

<span id="customerAddress">
    ---
</span>

</div>


<div class="info-box">

<strong>
    🏠 پلاک
</strong>

<span id="customerPlaque">
    ---
</span>

</div>


<div class="info-box">

<strong>
    📮 کد پستی
</strong>

<span id="customerPostalCode">
    ---
</span>

</div>


<div class="info-box">

<strong>
    📅 تاریخ سفارش
</strong>

<span id="orderDate">
    ---
</span>

</div>

</div>


<h2 class="products-title">
    🛍️ محصولات سفارش
</h2>

<div id="productList">
</div>


<div class="total">

مبلغ نهایی:
<span id="totalPrice">
    ۰
</span>
تومان

</div>


<div class="actions">

<button
    class="action-button"
    onclick="window.print()"
>
    🖨️ چاپ فاکتور
</button>

<a
    class="action-button"
    href="tracking.html"
>
    📦 پیگیری سفارش
</a>

<a
    class="action-button"
    href="index.html"
>
    🏠 فروشگاه
</a>

</div>

</div>

</div>


<footer>

فروشگاه لباس زرین دوخت

<br><br>

تمامی حقوق محفوظ است © ۲۰۲۶

</footer>


<script>

/* دریافت آخرین سفارش */

function loadInvoice() {

    const saved =
        localStorage.getItem("lastOrder");

    if (!saved) {

        document.getElementById("invoice").innerHTML = 
            <div class="empty">
                <h2>
                    ❌ سفارشی پیدا نشد
                </h2>

                <p>
                    هنوز سفارشی برای نمایش فاکتور وجود ندارد.
                </p>

                <a
                    href="index.html"
                    class="action-button"
                >
                    برگشت به فروشگاه
                </a>
            </div>
        ;

        return;
    }


    try {

        const order =
            JSON.parse(saved);


        document
            .getElementById("orderId")
            .textContent =
            order.id || "---";


        document
            .getElementById("customerName")
            .textContent =
            order.name || "---";


        document
            .getElementById("customerPhone")
            .textContent =
            order.phone || "---";


        document
            .getElementById("customerAddress")
            .textContent =
            order.address || "---";


        document
            .getElementById("customerPlaque")
            .textContent =
            order.plaque || "---";


        document
            .getElementById("customerPostalCode")
            .textContent =
            order.postalCode || "---";


        document
            .getElementById("orderDate")
            .textContent =
            order.date || "---";


        const productList =
            document.getElementById(
                "productList"
            );

        productList.innerHTML = "";


        let total = 0;


        if (
            Array.isArray(order.products)
        ) {

            order.products.forEach(
                function(item) {

                    const quantity =
                        Number(item.quantity) || 1;

                    const price =
                        Number(item.price) || 0;

                    const itemTotal =
                        price * quantity;

                    total += itemTotal;


                    const product =
                        document.createElement(
                            "div"
                        );

                    product.className =
                        "product";


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "product-name";

                    name.textContent =
                        (item.name || "محصول") +
                        " × " +
                        quantity;const priceElement =
                        document.createElement(
                            "div"
                        );

                    priceElement.className =
                        "product-price";

                    priceElement.textContent =
                        itemTotal.toLocaleString(
                            "fa-IR"
                        ) +
                        " تومان";


                    product.appendChild(name);

                    product.appendChild(
                        priceElement
                    );

                    productList.appendChild(
                        product
                    );

                }
            );

        }


        document
            .getElementById("totalPrice")
            .textContent =
            (
                Number(order.total) || total
            ).toLocaleString("fa-IR");


    } catch (error) {

        document.getElementById(
            "invoice"
        ).innerHTML = 
            <div class="empty">
                <h2>
                    ❌ خطا در نمایش فاکتور
                </h2>

                <p>
                    اطلاعات سفارش قابل خواندن نیست.
                </p>
            </div>
        ;

    }

}


/* حالت تیره */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    const isDark =
        document.body.classList.contains(
            "dark"
        );

    localStorage.setItem(
        "darkMode",
        isDark ? "on" : "off"
    );

    updateDarkButton();
}


function loadDarkMode() {

    const mode =
        localStorage.getItem("darkMode");

    if (mode === "on") {

        document.body.classList.add("dark");

    }

    updateDarkButton();
}


function updateDarkButton() {

    const button =
        document.getElementById(
            "darkButton"
        );

    if (!button) {
        return;
    }

    if (
        document.body.classList.contains(
            "dark"
        )
    ) {

        button.textContent =
            "☀️ حالت روشن";

    } else {

        button.textContent =
            "🌙 حالت تیره";

    }

}


/* اجرای اولیه */

loadInvoice();

loadDarkMode();

</script>

</body>
</html>
