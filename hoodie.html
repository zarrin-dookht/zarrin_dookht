<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>هودی سفید | زرین دوخت</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        .header-links {
            display: flex;
            gap: 10px;
        }

        .header-links a {
            color: white;
            text-decoration: none;
            background: #333;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .product-page {
            max-width: 1100px;
            margin: 45px auto;
            padding: 25px;
            background: white;
            border-radius: 20px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 40px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .images img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 15px;
        }

        .info {
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 26px;
            font-weight: bold;
            margin: 15px 0;
        }

        .description {
            color: #666;
            line-height: 2;
            font-size: 17px;
        }

        .buy-button {
            border: none;
            background: #111;
            color: white;
            padding: 16px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;
        }

        .buy-button:hover {
            background: #333;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 40px;
        }

        @media (max-width: 750px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            .product-page {
                grid-template-columns: 1fr;
                margin: 20px;
                padding: 15px;
            }

            .images img {
                height: 350px;
            }

            .info {
                padding: 15px;
            }

            .info h1 {
                font-size: 29px;
            }
        }

        @media (max-width: 450px) {

            .images img {
                height: 280px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        👕 زرین دوخت
    </div>


    <div class="header-links">

        <a href="index.html">
            🏠 خانه
        </a>

        <a href="cart.html">
            🛒 سبد خرید
        </a>

    </div>

</header>



<main class="product-page">


    <div class="images">

        <img
            src="image/hoodie-front.jpg.jpeg"
            alt="نمای جلوی هودی سفید"
        >

        <img
            src="image/hoodie-back.jpg.jpeg"
            alt="نمای پشت هودی سفید"
        >

    </div>



    <div class="info">

    <h1>
        هودی سفید
    </h1>

    <div class="price">
        ۸۰۰,۰۰۰ تومان
    </div>

    <p class="description">
        هودی سفید با طراحی زیبا و راحت،
        مناسب استفاده روزمره و فصل‌های سرد.
    </p>

    <button
        class="buy-button"
        onclick="addToCart()"
    >
        🛒 افزودن به سبد خرید
    </button>

    <a
        class="back"
        href="index.html"
    >
        ← برگشت به فروشگاه
    </a>

</div>
