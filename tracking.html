<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پیگیری سفارش | زرین دوخت</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
    transition: 0.3s;
}

body.dark {
    background: #181818;
    color: white;
}

header {
    background: #111;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav a,
.dark-button {
    color: white;
    text-decoration: none;
    background: #333;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

.container {
    max-width: 800px;
    margin: 45px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

body.dark .box {
    background: #242424;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

body.dark .subtitle {
    color: #bbb;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
    font-family: inherit;
}

body.dark input {
    background: #333;
    color: white;
    border-color: #555;
}

.track-button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.track-button:hover {
    background: #333;
}

.result {
    display: none;
    margin-top: 30px;
    padding: 22px;
    border-radius: 14px;
    background: #f7f7f7;
}

body.dark .result {
    background: #303030;
}

.status {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

.info {
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
}

body.dark .info {
    border-color: #555;
}

.products {
    margin-top: 15px;
}

.product-item {
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
}

body.dark .product-item {
    border-color: #555;
}

.total {
    margin-top: 20px;
    text-align: center;
    font-size: 21px;
    font-weight: bold;
}

.error {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 9px;
    background: #ffe5e5;
    color: #b00000;
    text-align: center;
}

body.dark .error {
    background: #4a2525;
    color: #ffb0b0;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #555;
    text-decoration: none;
}

body.dark .back {
    color: #ddd;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 30px;
    margin-top: 60px;
}

@media (max-width: 600px) {
    header {
        flex-direction: column;
    }

    .container {
        padding: 12px;
    }

    .box {
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
    👕 زرین دوخت
</div>

<nav>

<a href="index.html">
    🏠 خانه
</a>

<a href="cart.html">
    🛒 سبد خرید
</a>

<a href="tracking.html">
    📦 پیگیری سفارش
</a>

<button
    class="dark-button"
    id="darkButton"
    onclick="toggleDarkMode()"
>
    🌙 حالت تیره
</button>

</nav>

</header>


<div class="container">

<div class="box">

<h1>
    📦 پیگیری سفارش
</h1>

<p class="subtitle">
    کد پیگیری سفارش خود را وارد کنید
</p>


<label>
    کد پیگیری
</label>

<input
    type="text"
    id="trackingCode"
    placeholder="مثلاً 1750000000000"
    inputmode="numeric"
>


<button
    class="track-button"
    onclick="trackOrder()"
>
    🔍 پیگیری سفارش
</button>


<div
    id="error"
    class="error"
>
    ❌ سفارشی با این کد پیدا نشد.
</div>


<div
    id="result"
    class="result"
><div
    id="status"
    class="status"
>
    🟡 در انتظار بررسی
</div>

<div class="info">
    <strong>کد سفارش:</strong>
    <span id="orderId"></span>
</div>

<div class="info">
    <strong>نام مشتری:</strong>
    <span id="customerName"></span>
</div>

<div class="info">
    <strong>شماره تماس:</strong>
    <span id="customerPhone"></span>
</div>

<div class="info">
    <strong>تاریخ ثبت:</strong>
    <span id="orderDate"></span>
</div>

<div class="products">

<strong>
    🛍️ محصولات:
</strong>

<div id="productList"></div>

</div>

<div class="total">
    مجموع:
    <span id="orderTotal">
        ۰
    </span>
    تومان
</div>

</div>


<a
    href="index.html"
    class="back"
>
    ← برگشت به فروشگاه
</a>

</div>

</div>


<footer>

فروشگاه لباس زرین دوخت

<br><br>

تمامی حقوق محفوظ است © ۲۰۲۶

</footer>


<script>

/* پیگیری سفارش */

function trackOrder() {

    const code =
        document
            .getElementById("trackingCode")
            .value
            .trim();

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    error.style.display = "none";
    result.style.display = "none";


    if (!code) {

        error.textContent =
            "❌ لطفاً کد پیگیری را وارد کنید.";

        error.style.display = "block";

        return;
    }


    const saved =
        localStorage.getItem("lastOrder");


    if (!saved) {

        error.textContent =
            "❌ سفارشی برای پیگیری پیدا نشد.";

        error.style.display = "block";

        return;
    }


    try {

        const order =
            JSON.parse(saved);


        if (
            String(order.id) !==
            String(code)
        ) {

            error.textContent =
                "❌ کد پیگیری اشتباه است.";

            error.style.display = "block";

            return;
        }


        document
            .getElementById("orderId")
            .textContent =
            order.id;


        document
            .getElementById("customerName")
            .textContent =
            order.name || "-";


        document
            .getElementById("customerPhone")
            .textContent =
            order.phone || "-";


        document
            .getElementById("orderDate")
            .textContent =
            order.date || "-";


        const productList =
            document
                .getElementById("productList");

        productList.innerHTML = "";


        let total = 0;


        if (
            Array.isArray(order.products)
        ) {

            order.products.forEach(
                function(item) {

                    const quantity =
                        Number(item.quantity) || 1;

                    const price =
                        Number(item.price) || 0;

                    total +=
                        price * quantity;


                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "product-item";

                    div.textContent =
                        item.name +
                        " × " +
                        quantity +
                        " — " +
                        (
                            price * quantity
                        ).toLocaleString("fa-IR") +
                        " تومان";

                    productList.appendChild(div);

                }
            );

        }


        document
            .getElementById("orderTotal")
            .textContent =
            (
                Number(order.total) || total
            ).toLocaleString("fa-IR");


        result.style.display = "block";

    } catch (error) {

        error.textContent =
            "❌ اطلاعات سفارش قابل خواندن نیست.";

        error.style.display = "block";

    }
}


/* حالت تیره */

function toggleDarkMode() {

    document.body.classList.toggle("dark");const isDark =
        document.body.classList.contains(
            "dark"
        );

    localStorage.setItem(
        "darkMode",
        isDark ? "on" : "off"
    );

    updateDarkButton();
}


function loadDarkMode() {

    const mode =
        localStorage.getItem("darkMode");

    if (mode === "on") {

        document.body.classList.add("dark");

    }

    updateDarkButton();
}


function updateDarkButton() {

    const button =
        document.getElementById("darkButton");

    if (!button) {
        return;
    }

    if (
        document.body.classList.contains(
            "dark"
        )
    ) {

        button.textContent =
            "☀️ حالت روشن";

    } else {

        button.textContent =
            "🌙 حالت تیره";

    }
}


loadDarkMode();

</script>

</body>
</html>
